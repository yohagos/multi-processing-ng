<div #scrollContainer class="message-field" (ngAfterViewChecked)="scrollToBottom()">
  <div class="scrollable-message-field">
    @if (loggedInUser()) {
      @for (msg of messages(); track $index) {
        <app-messages
          [message]="msg"
          [isSelectedAsParent]="selectedParentMessageId === msg.id"
        ></app-messages>
      }
    }
  </div>

</div>
