<div class="message-field">
  <div class="scrollable-message-field">
    @if (loggedInUser()) {

    }
    @for (item of publicMessages()?.messages; track $index) {
        <app-messages
          [message]="item"
          [isSelectedAsParent]="selectedParentMessageId === item.id"
          (selectedAsParent)="markMessageAsParent($event)"
        ></app-messages>
      }
  </div>
</div>
